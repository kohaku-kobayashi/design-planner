<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ふたりでつくる ホテルギャラリー・ポスター</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        mincho: ['"Shippori Mincho"', '"Hiragino Mincho ProN"', '"Yu Mincho"', 'serif'],
                        cinzel: ['Cinzel', 'serif']
                    }
                }
            }
        };
    </script>
    <!-- Google Fonts（BIZ UDPゴシック：読みやすさに配慮したUDフォント／しっぽり明朝：見出し・ポスターの和文） -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Cinzel:wght@400;500;600&family=Montserrat:wght@300;400;500;600&family=Shippori+Mincho:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html { font-size: 17px; }
        body {
            font-family: 'BIZ UDPGothic', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
            line-height: 1.7;
        }

        /* スライダー：つまみを大きく、溝を太くして操作しやすく */
        input[type="range"] {
            -webkit-appearance: none; appearance: none;
            width: 100%; height: 36px; background: transparent; cursor: pointer;
        }
        input[type="range"]::-webkit-slider-runnable-track {
            height: 8px; border-radius: 999px; background: #57534e;
        }
        input[type="range"]::-moz-range-track {
            height: 8px; border-radius: 999px; background: #57534e;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 30px; height: 30px; margin-top: -11px; border-radius: 50%;
            background: #f5f5f4; border: 3px solid #a8a29e; box-shadow: 0 2px 6px rgba(0,0,0,.5);
        }
        input[type="range"]::-moz-range-thumb {
            width: 26px; height: 26px; border-radius: 50%;
            background: #f5f5f4; border: 3px solid #a8a29e; box-shadow: 0 2px 6px rgba(0,0,0,.5);
        }
        input[type="range"]:focus-visible { outline: 2px solid #fde68a; outline-offset: 2px; border-radius: 8px; }
        input[type="checkbox"] { width: 24px; height: 24px; accent-color: #d6d3d1; flex-shrink: 0; }
        input[type="color"] { -webkit-appearance: none; appearance: none; border: none; padding: 0; background: none; cursor: pointer; }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: 2px solid rgba(255,255,255,.35); border-radius: 12px; }
        input[type="color"]::-moz-color-swatch { border: 2px solid rgba(255,255,255,.35); border-radius: 12px; }
        #posterCanvas { touch-action: none; }
    </style>
    <style type="text/tailwindcss">
        @layer components {
            .panel { @apply bg-stone-900/80 p-5 sm:p-6 rounded-2xl border border-stone-700/70 shadow-2xl space-y-5; }
            .step-title { @apply flex flex-wrap items-baseline gap-x-3 gap-y-1 font-mincho text-xl font-semibold text-stone-50 leading-snug; }
            .step-no { @apply font-cinzel text-base text-amber-200 tracking-widest; }
            .step-en { @apply font-cinzel text-xs tracking-[0.2em] text-stone-400 ml-auto; }
            .help { @apply text-base text-stone-300 leading-relaxed; }
            .btn { @apply inline-flex items-center justify-center gap-2 min-h-[48px] px-4 py-2 rounded-xl border border-stone-600 bg-stone-800 text-stone-100 text-base leading-tight hover:bg-stone-700 hover:border-stone-400 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-200 disabled:opacity-40 disabled:cursor-not-allowed; }
            .btn-primary { @apply bg-stone-100 text-stone-950 border-stone-100 font-bold hover:bg-white hover:border-white; }
            .btn-ghost { @apply bg-transparent border-transparent hover:bg-stone-800 hover:border-stone-600; }
            .btn-danger { @apply text-rose-200 border-rose-900/70 hover:bg-rose-950 hover:border-rose-700; }
            .btn-on { @apply bg-amber-100 text-stone-950 border-amber-100 font-bold hover:bg-amber-50; }
            .field { @apply w-full px-4 py-3 bg-stone-950 border border-stone-600 rounded-xl text-base text-stone-50 placeholder:text-stone-400 focus:outline-none focus:ring-2 focus:ring-amber-200/70 focus:border-stone-400; }
            .label { @apply block text-base font-bold text-stone-100 mb-1.5; }
            .subbox { @apply bg-stone-950/60 p-4 rounded-xl border border-stone-700; }
        }
    </style>
</head>
<body class="bg-stone-950 text-stone-100 min-h-screen flex flex-col antialiased selection:bg-stone-600 selection:text-white">

    <!-- ヘッダー -->
    <header class="bg-stone-950/95 backdrop-blur-md border-b border-stone-800 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-12 py-3 min-h-[80px] flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-4">
                <div class="w-11 h-11 rounded-full border border-stone-600 flex items-center justify-center text-amber-100">
                    <i class="fa-solid fa-feather"></i>
                </div>
                <div>
                    <h1 class="font-mincho text-lg sm:text-xl font-semibold text-stone-50 leading-tight">ふたりでつくる ホテルギャラリー・ポスター</h1>
                    <p class="font-cinzel text-xs tracking-[0.25em] text-stone-400">HOTEL GALLERY EDITION</p>
                </div>
            </div>
            <div id="header-actions" class="flex flex-wrap items-center gap-2"></div>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-12 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">

        <!-- 操作パネル（左側） -->
        <section class="lg:col-span-5 space-y-6">

            <!-- 1. 雰囲気（たたき台の配色） -->
            <div class="panel">
                <h2 class="step-title"><span class="step-no">01</span>雰囲気をえらぶ<span class="step-en">Atmosphere</span></h2>
                <div class="grid grid-cols-2 gap-3" id="mood-selector">
                    <button data-mood="calm" class="mood-btn btn btn-on justify-between text-left">
                        <span>静寂・コンクリート</span><i class="fa-solid fa-check check-icon"></i>
                    </button>
                    <button data-mood="energetic" class="mood-btn btn justify-between text-left">
                        <span>モダン・テラコッタ</span><i class="fa-solid fa-check check-icon hidden"></i>
                    </button>
                    <button data-mood="luxury" class="mood-btn btn justify-between text-left">
                        <span>真鍮・ダークオーク</span><i class="fa-solid fa-check check-icon hidden"></i>
                    </button>
                    <button data-mood="natural" class="mood-btn btn justify-between text-left">
                        <span>白木・リネン</span><i class="fa-solid fa-check check-icon hidden"></i>
                    </button>
                </div>
            </div>

            <!-- 2. 色 -->
            <div class="panel">
                <div class="flex flex-wrap items-center justify-between gap-3">
                    <h2 class="step-title"><span class="step-no">02</span>色をえらぶ<span class="step-en sr-only">Swatches</span></h2>
                    <button id="btn-shuffle-palette" class="btn btn-sm">
                        <i class="fa-solid fa-rotate"></i> 別の配色にする
                    </button>
                </div>
                <div id="palette-list" class="space-y-2.5"></div>
            </div>

            <!-- 3. 形 -->
            <div class="panel">
                <div class="flex flex-wrap items-center justify-between gap-3">
                    <h2 class="step-title"><span class="step-no">03</span>形をくみあわせる<span class="step-en sr-only">Shapes</span></h2>
                    <label class="flex items-center gap-2 text-base text-stone-200 cursor-pointer min-h-[48px]">
                        <input type="checkbox" id="show-red-outline">
                        選択中の図形を示す枠
                    </label>
                </div>

                <!-- 全体の大きさ -->
                <div class="subbox space-y-1">
                    <div class="flex justify-between items-center">
                        <label for="shape-scale" class="font-bold text-stone-100">全体の大きさ</label>
                        <span id="scale-value" class="font-mono text-stone-200 bg-stone-900 px-2 py-0.5 rounded border border-stone-700">1.0倍</span>
                    </div>
                    <input type="range" id="shape-scale" min="0.5" max="1.6" step="0.1" value="1.0">
                </div>

                <!-- 図形ごとの設定 -->
                <div class="space-y-3" id="sub-shape-controls"></div>

                <!-- タイトル -->
                <div class="pt-4 border-t border-stone-700">
                    <label for="poster-title" class="label">作品のタイトル</label>
                    <input type="text" id="poster-title" value="AESTHETIC SILENCE" class="field">
                </div>
            </div>
        </section>

        <!-- ポスターのプレビュー（右側） -->
        <section class="lg:col-span-7 lg:sticky lg:top-28 flex flex-col items-center">
            <div class="w-full panel flex flex-col items-center">

                <div class="w-full flex flex-wrap items-center justify-between gap-3">
                    <h2 class="step-title"><i class="fa-solid fa-image text-amber-200 text-base"></i>できあがり<span class="step-en">Gallery Preview</span></h2>
                    <div id="preview-actions" class="flex flex-wrap gap-2">
                        <button id="btn-download" class="btn btn-primary">
                            <i class="fa-solid fa-download"></i> 画像で保存
                        </button>
                    </div>
                </div>

                <!-- 額縁のような背景 -->
                <div class="w-full flex justify-center items-center bg-[#0a0a0a] p-4 sm:p-6 rounded-2xl border border-stone-800 overflow-hidden shadow-2xl relative">
                    <div class="absolute inset-2 border border-stone-800/60 pointer-events-none rounded-xl"></div>
                    <canvas id="posterCanvas" class="max-w-full h-auto rounded shadow-2xl cursor-pointer" width="800" height="1131" aria-label="ポスターのプレビュー"></canvas>
                </div>

                <p id="canvas-help" class="help text-center">
                    図形をタップすると、その図形を選べます。
                </p>
            </div>
        </section>

    </main>

    <!-- お知らせ（トースト） -->
    <div id="toast" role="status" aria-live="polite" class="fixed bottom-6 right-6 left-6 sm:left-auto bg-stone-800 border border-stone-500 text-stone-50 text-base px-5 py-4 rounded-xl shadow-2xl flex items-center gap-3 transition-all duration-300 transform translate-y-20 opacity-0 pointer-events-none z-50">
        <i class="fa-solid fa-check text-amber-200"></i>
        <span id="toast-message">カラーコードをコピーしました</span>
    </div>

    <!-- JavaScript ロジック -->
    <script>
        const PALETTE_DATA = {
            calm: [
                {
                    name: "Architectural Concrete",
                    colors: [
                        { hex: "#1C1C1E", name: "Deep Charcoal" },
                        { hex: "#3A3A3C", name: "Raw Concrete" },
                        { hex: "#636366", name: "Muted Lead" },
                        { hex: "#AEAEB2", name: "Silver Haze" },
                        { hex: "#F2F2F7", name: "Plaster White" }
                    ]
                },
                {
                    name: "Nordic Fjord",
                    colors: [
                        { hex: "#11161A", name: "Abyss Dark" },
                        { hex: "#232D36", name: "Fjord Slate" },
                        { hex: "#485A6A", name: "Nordic Steel" },
                        { hex: "#95A5B3", name: "Glacial Fog" },
                        { hex: "#F4F6F8", name: "Clean Snow" }
                    ]
                }
            ],
            energetic: [
                {
                    name: "Modern Terracotta",
                    colors: [
                        { hex: "#1A1512", name: "Espresso Black" },
                        { hex: "#8C4A32", name: "Burnt Sienna" },
                        { hex: "#C28E61", name: "Warm Ochre" },
                        { hex: "#D6C7B2", name: "Sandstone" },
                        { hex: "#FAF7F2", name: "Warm Alabaster" }
                    ]
                },
                {
                    name: "Warm Clay",
                    colors: [
                        { hex: "#221A16", name: "Rich Umber" },
                        { hex: "#A35C44", name: "Raw Clay" },
                        { hex: "#D9A066", name: "Desert Sun" },
                        { hex: "#E8E1D5", name: "Ecru Linen" },
                        { hex: "#FFFFFF", name: "Pure Canvas" }
                    ]
                }
            ],
            luxury: [
                {
                    name: "Brass & Noir",
                    colors: [
                        { hex: "#0D0D0D", name: "Midnight Obsidian" },
                        { hex: "#262626", name: "Dark Graphite" },
                        { hex: "#C49A45", name: "Antique Brass" },
                        { hex: "#D9D2C3", name: "Champagne Silk" },
                        { hex: "#F7F5F0", name: "Ivory Paper" }
                    ]
                },
                {
                    name: "Dark Velvet",
                    colors: [
                        { hex: "#0A0D0F", name: "Deep Void" },
                        { hex: "#17212B", name: "Inky Navy" },
                        { hex: "#B89753", name: "Muted Gold" },
                        { hex: "#8A99A8", name: "Steel Grey" },
                        { hex: "#F5F6F8", name: "Clean Pearl" }
                    ]
                }
            ],
            natural: [
                {
                    name: "Wabi-Sabi Wood",
                    colors: [
                        { hex: "#1A1917", name: "Charred Wood" },
                        { hex: "#423E37", name: "Raw Walnut" },
                        { hex: "#8C8275", name: "Stonewash" },
                        { hex: "#D9D4CB", name: "Natural Hemp" },
                        { hex: "#F7F5F0", name: "Rice Paper" }
                    ]
                },
                {
                    name: "Zen Garden",
                    colors: [
                        { hex: "#161A17", name: "Deep Moss" },
                        { hex: "#354038", name: "Forest Pine" },
                        { hex: "#8C968E", name: "Sage Haze" },
                        { hex: "#E3E5E2", name: "River Stone" },
                        { hex: "#FAFAFA", name: "Morning Mist" }
                    ]
                }
            ]
        };

        const state = {
            mood: 'calm',
            paletteIndex: 0,
            scale: 1.0,
            showRedOutline: false,
            title: 'AESTHETIC SILENCE',
            selectedIndex: 0,
            shapeLayers: [
                { type: 'double-circle', size: 1.1, offsetX: -20, offsetY: 20 },
                { type: 'arch', size: 0.95, offsetX: 50, offsetY: -50 },
                { type: 'rect', size: 0.7, offsetX: -80, offsetY: -70 },
                { type: 'triangle', size: 0.8, offsetX: 70, offsetY: 80 }
            ]
        };

        const moodButtons = document.querySelectorAll('.mood-btn');
        const paletteListContainer = document.getElementById('palette-list');
        const shapeScaleInput = document.getElementById('shape-scale');
        const scaleValueDisplay = document.getElementById('scale-value');
        const posterTitleInput = document.getElementById('poster-title');
        const btnShufflePalette = document.getElementById('btn-shuffle-palette');
        const btnDownload = document.getElementById('btn-download');
        const canvas = document.getElementById('posterCanvas');
        const ctx = canvas.getContext('2d');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toast-message');
        const subShapeControls = document.getElementById('sub-shape-controls');
        const showRedOutlineCheck = document.getElementById('show-red-outline');

        // 図形の大きさ・位置の基準（描画とクリック判定で共通に使う）
        const BASE_SIZE = 210;
        function getLayout() {
            return {
                centerX: canvas.width / 2,
                centerY: canvas.height / 2 - 50,
                baseSize: BASE_SIZE * state.scale
            };
        }

        // ポスター用フォントの読み込みを待つ（オフライン等で読めない場合も数秒で描画に進む）
        function waitForFonts() {
            if (!document.fonts || !document.fonts.load) return Promise.resolve();
            const loads = [
                document.fonts.load('600 44px "Cinzel"'),
                document.fonts.load('400 13px "Montserrat"'),
                document.fonts.load('500 11px "Montserrat"'),
                document.fonts.load('600 44px "Shippori Mincho"', 'あ漢')
            ];
            const timeout = new Promise(resolve => setTimeout(resolve, 3000));
            return Promise.race([Promise.all(loads).then(() => document.fonts.ready), timeout]).catch(() => {});
        }

        async function init() {
            bindEvents();
            renderSubShapeControls();
            renderPaletteList();
            await waitForFonts();
            drawPoster();
            // 後から読み込まれた字形（日本語の追加サブセット等）があれば描き直す
            if (document.fonts) document.fonts.addEventListener('loadingdone', () => drawPoster());
        }

        function getCurrentPalette() {
            const moodPalettes = PALETTE_DATA[state.mood];
            return moodPalettes[state.paletteIndex % moodPalettes.length];
        }

        function getCurrentColors() {
            return getCurrentPalette().colors;
        }

        function renderPaletteList() {
            const colors = getCurrentColors();
            paletteListContainer.innerHTML = '';

            colors.forEach((color) => {
                const item = document.createElement('div');
                item.className = 'flex items-center justify-between gap-3 p-3 rounded-xl border border-stone-700 bg-stone-950/60';
                item.innerHTML = `
                    <div class="flex items-center gap-4 min-w-0">
                        <div class="w-12 h-12 rounded-lg border border-white/20 flex-shrink-0" style="background-color: ${color.hex}"></div>
                        <div class="min-w-0">
                            <p class="text-base font-bold text-stone-50">${color.name}</p>
                            <p class="text-sm font-mono text-stone-300">${color.hex}</p>
                        </div>
                    </div>
                    <button type="button" class="btn btn-sm btn-ghost copy-btn"><i class="fa-regular fa-copy"></i>コピー</button>
                `;
                item.querySelector('.copy-btn').addEventListener('click', () => copyToClipboard(color.hex));
                paletteListContainer.appendChild(item);
            });
        }

        function renderSubShapeControls() {
            subShapeControls.innerHTML = '';

            const shapeTypes = [
                { id: 'double-circle', label: '二重丸' },
                { id: 'arch', label: 'アーチ' },
                { id: 'triangle', label: '三角' },
                { id: 'rect', label: '四角' },
                { id: 'wave', label: 'だ円' }
            ];

            state.shapeLayers.forEach((layer, idx) => {
                const isSelected = (state.selectedIndex === idx);
                const wrapper = document.createElement('div');
                wrapper.className = `p-4 rounded-xl border-2 transition-colors cursor-pointer ${isSelected ? 'border-amber-200/80 bg-stone-800/70' : 'border-stone-700 bg-stone-950/40 hover:border-stone-500'}`;

                let typeButtonsHtml = '';
                shapeTypes.forEach(st => {
                    const active = layer.type === st.id;
                    typeButtonsHtml += `<button type="button" data-idx="${idx}" data-shape-type="${st.id}" class="layer-type-btn btn btn-sm ${active ? 'btn-on' : ''}">${st.label}</button>`;
                });

                wrapper.innerHTML = `
                    <p class="font-bold text-base text-stone-50 mb-2">図形 ${idx + 1} ${isSelected ? '<span class="text-amber-200">（選択中）</span>' : ''}</p>
                    <div class="flex flex-wrap gap-2 mb-3">${typeButtonsHtml}</div>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-x-4 text-base">
                        <label class="block text-stone-200">大きさ
                            <input type="range" min="0.3" max="2.0" step="0.05" value="${layer.size}" data-idx="${idx}" data-type="size" class="param-input">
                        </label>
                        <label class="block text-stone-200">左右の位置
                            <input type="range" min="-160" max="160" step="5" value="${layer.offsetX}" data-idx="${idx}" data-type="offsetX" class="param-input">
                        </label>
                        <label class="block text-stone-200">上下の位置
                            <input type="range" min="-160" max="160" step="5" value="${layer.offsetY}" data-idx="${idx}" data-type="offsetY" class="param-input">
                        </label>
                    </div>
                `;

                wrapper.addEventListener('click', (e) => {
                    if (e.target.tagName !== 'INPUT' && !e.target.classList.contains('layer-type-btn')) {
                        state.selectedIndex = idx;
                        renderSubShapeControls();
                        drawPoster();
                    }
                });

                subShapeControls.appendChild(wrapper);
            });

            document.querySelectorAll('.layer-type-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const idx = parseInt(btn.dataset.idx);
                    const shapeType = btn.dataset.shapeType;
                    state.selectedIndex = idx;
                    state.shapeLayers[idx].type = shapeType;
                    renderSubShapeControls();
                    drawPoster();
                });
            });

            document.querySelectorAll('.param-input').forEach(input => {
                input.addEventListener('input', (e) => {
                    const idx = parseInt(e.target.dataset.idx);
                    const type = e.target.dataset.type;
                    const val = parseFloat(e.target.value);
                    
                    state.selectedIndex = idx;
                    state.shapeLayers[idx][type] = val;
                    drawPoster();
                });
            });
        }

        function copyToClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => showToast(`カラーコード ${text} をコピーしました`));
            } else {
                execCopyCommand(text);
            }
        }

        function execCopyCommand(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.opacity = "0";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showToast(`カラーコード ${text} をコピーしました`);
            } catch (err) {}
            document.body.removeChild(textArea);
        }

        let toastTimeout;
        function showToast(msg) {
            toastMessage.textContent = msg;
            toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
            toast.classList.add('translate-y-0', 'opacity-100');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
            }, 2500);
        }

        function bindEvents() {
            moodButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    moodButtons.forEach(b => {
                        b.classList.remove('btn-on');
                        b.querySelector('.check-icon').classList.add('hidden');
                    });
                    btn.classList.add('btn-on');
                    btn.querySelector('.check-icon').classList.remove('hidden');

                    state.mood = btn.getAttribute('data-mood');
                    state.paletteIndex = 0;
                    renderPaletteList();
                    drawPoster();
                });
            });

            btnShufflePalette.addEventListener('click', () => {
                const max = PALETTE_DATA[state.mood].length;
                state.paletteIndex = (state.paletteIndex + 1) % max;
                renderPaletteList();
                drawPoster();
            });

            shapeScaleInput.addEventListener('input', (e) => {
                state.scale = parseFloat(e.target.value);
                scaleValueDisplay.textContent = `${state.scale.toFixed(1)}倍`;
                drawPoster();
            });

            showRedOutlineCheck.addEventListener('change', (e) => {
                state.showRedOutline = e.target.checked;
                drawPoster();
            });

            posterTitleInput.addEventListener('input', (e) => {
                state.title = e.target.value || "ふたりのギャラリー";
                drawPoster();
            });

            canvas.addEventListener('click', (e) => {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const clickX = (e.clientX - rect.left) * scaleX;
                const clickY = (e.clientY - rect.top) * scaleY;

                const clickedIdx = hitTestShape(clickX, clickY);

                if (clickedIdx !== -1) {
                    state.selectedIndex = clickedIdx;
                    renderSubShapeControls();
                    drawPoster();
                }
            });

            btnDownload.addEventListener('click', () => {
                const tempOutline = state.showRedOutline;
                state.showRedOutline = false;
                drawPoster();

                const link = document.createElement('a');
                link.download = `hotel-gallery-poster-${state.mood}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();

                state.showRedOutline = tempOutline;
                drawPoster();
            });
        }

        // ホテルギャラリー風ポスター描画エンジン
        function drawPoster() {
            const width = canvas.width;
            const height = canvas.height;
            const paletteObj = getCurrentColors();
            const colors = paletteObj.map(c => c.hex);

            // 背景：高級紙のような美しいマットグラデーション
            const bgGradient = ctx.createLinearGradient(0, 0, width, height);
            bgGradient.addColorStop(0, colors[4] || '#FAF8F5');
            bgGradient.addColorStop(1, adjustBrightness(colors[4] || '#FAF8F5', -8));
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, width, height);

            // 内側の極細ボーダー（額縁のエッジ）
            ctx.strokeStyle = adjustBrightness(colors[4] || '#FAF8F5', -22);
            ctx.lineWidth = 1;
            ctx.strokeRect(48, 48, width - 96, height - 96);

            const { centerX, centerY, baseSize } = getLayout();

            // 背景の円形幾何学スタンプ
            ctx.strokeStyle = adjustBrightness(colors[4] || '#FAF8F5', -16);
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(centerX, centerY, baseSize * 1.5, 0, Math.PI * 2);
            ctx.stroke();

            // 各パーツ描画（半透明のレイヤーバランス）
            state.shapeLayers.forEach((layer, idx) => {
                const lx = centerX + layer.offsetX * state.scale;
                const ly = centerY + layer.offsetY * state.scale;
                const size = baseSize * layer.size;
                const color = colors[(idx + 1) % colors.length];

                ctx.save();
                ctx.shadowColor = 'rgba(0, 0, 0, 0.12)';
                ctx.shadowBlur = 24;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 10;

                if (layer.type === 'triangle') {
                    drawTriangle(lx, ly, size, color);
                } else if (layer.type === 'double-circle') {
                    drawDoubleCircle(lx, ly, size, color, colors[3], colors[0]);
                } else if (layer.type === 'rect') {
                    drawRectangle(lx, ly, size, color);
                } else if (layer.type === 'arch') {
                    drawArch(lx, ly, size, color);
                } else if (layer.type === 'wave') {
                    drawWave(lx, ly, size, color);
                }
                ctx.restore();
            });

            // 赤点線ガイドUI
            if (state.showRedOutline) {
                state.shapeLayers.forEach((layer, idx) => {
                    const isSelected = (idx === state.selectedIndex);
                    const lx = centerX + layer.offsetX * state.scale;
                    const ly = centerY + layer.offsetY * state.scale;
                    const size = baseSize * layer.size;

                    ctx.save();
                    ctx.strokeStyle = isSelected ? '#E11D48' : 'rgba(225, 29, 72, 0.35)';
                    ctx.lineWidth = isSelected ? 2.5 : 1;
                    ctx.setLineDash(isSelected ? [6, 4] : [3, 3]);

                    ctx.beginPath();
                    ctx.arc(lx, ly, size + 16, 0, Math.PI * 2);
                    ctx.stroke();

                    ctx.fillStyle = isSelected ? '#E11D48' : 'rgba(225, 29, 72, 0.5)';
                    ctx.beginPath();
                    ctx.arc(lx, ly, isSelected ? 5 : 3, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.restore();
                });
            }

            drawHotelTypography(width, height, colors, paletteObj);
        }

        // 図形の輪郭（描画とクリック判定の両方で使う）
        function shapePath(type, x, y, radius) {
            const p = new Path2D();
            if (type === 'triangle') {
                for (let i = 0; i < 3; i++) {
                    const angle = (i * 120 - 90) * Math.PI / 180;
                    const tx = x + radius * Math.cos(angle);
                    const ty = y + radius * Math.sin(angle);
                    if (i === 0) p.moveTo(tx, ty);
                    else p.lineTo(tx, ty);
                }
                p.closePath();
            } else if (type === 'double-circle') {
                // 外側の輪の太さぶんを含めた円
                p.arc(x, y, radius * 1.07, 0, Math.PI * 2);
            } else if (type === 'rect') {
                const side = radius * 1.4;
                p.rect(x - side / 2, y - side / 2, side, side);
            } else if (type === 'arch') {
                const w = radius * 1.2;
                const h = radius * 1.7;
                p.arc(x, y - h / 4, w / 2, Math.PI, 0, false);
                p.lineTo(x + w / 2, y + h / 2);
                p.lineTo(x - w / 2, y + h / 2);
                p.closePath();
            } else if (type === 'wave') {
                p.ellipse(x, y, radius * 1.3, radius * 0.65, Math.PI / 8, 0, Math.PI * 2);
            }
            return p;
        }

        // 前面（後に描いた図形）から順に判定し、最初に当たった図形を返す
        function hitTestShape(px, py) {
            const { centerX, centerY, baseSize } = getLayout();
            ctx.save();
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.lineWidth = 24; // 指でも選びやすいよう輪郭の外側にも少し余裕を持たせる
            let found = -1;
            for (let idx = state.shapeLayers.length - 1; idx >= 0; idx--) {
                const layer = state.shapeLayers[idx];
                const lx = centerX + layer.offsetX * state.scale;
                const ly = centerY + layer.offsetY * state.scale;
                const path = shapePath(layer.type, lx, ly, baseSize * layer.size);
                if (ctx.isPointInPath(path, px, py) || ctx.isPointInStroke(path, px, py)) {
                    found = idx;
                    break;
                }
            }
            ctx.restore();
            return found;
        }

        function drawTriangle(x, y, radius, color) {
            ctx.save();
            ctx.fillStyle = color;
            ctx.globalAlpha = 0.82;
            ctx.fill(shapePath('triangle', x, y, radius));
            ctx.restore();
        }

        function drawDoubleCircle(x, y, radius, outerColor, innerColor, accentColor) {
            ctx.save();
            ctx.globalAlpha = 0.88;
            ctx.strokeStyle = outerColor;
            ctx.lineWidth = radius * 0.14;
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.stroke();

            ctx.globalAlpha = 0.92;
            ctx.fillStyle = innerColor;
            ctx.beginPath();
            ctx.arc(x, y, radius * 0.45, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = accentColor;
            ctx.beginPath();
            ctx.arc(x, y, radius * 0.12, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function drawRectangle(x, y, radius, color) {
            ctx.save();
            ctx.fillStyle = color;
            ctx.globalAlpha = 0.85;
            const side = radius * 1.4;
            ctx.beginPath();
            ctx.roundRect(x - side/2, y - side/2, side, side, 4);
            ctx.fill();
            ctx.restore();
        }

        function drawArch(x, y, radius, color) {
            ctx.save();
            ctx.fillStyle = color;
            ctx.globalAlpha = 0.88;
            const w = radius * 1.2;
            const h = radius * 1.7;
            ctx.beginPath();
            ctx.arc(x, y - h/4, w/2, Math.PI, 0, false);
            ctx.lineTo(x + w/2, y + h/2);
            ctx.lineTo(x - w/2, y + h/2);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function drawWave(x, y, radius, color) {
            ctx.save();
            ctx.fillStyle = color;
            ctx.globalAlpha = 0.85;
            ctx.beginPath();
            ctx.ellipse(x, y, radius * 1.3, radius * 0.65, Math.PI / 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        // 字間つきで文字を描く。ctx.letterSpacing 非対応のブラウザでは1文字ずつ並べて同じ見た目にする
        const SUPPORTS_LETTER_SPACING = 'letterSpacing' in CanvasRenderingContext2D.prototype;
        function measureSpaced(text, spacing) {
            if (!spacing) return ctx.measureText(text).width;
            if (SUPPORTS_LETTER_SPACING) {
                ctx.letterSpacing = `${spacing}px`;
                const w = ctx.measureText(text).width;
                ctx.letterSpacing = '0px';
                return w;
            }
            let w = 0;
            for (const ch of text) w += ctx.measureText(ch).width + spacing;
            return w;
        }
        function fillSpacedText(text, x, y, spacing = 0, align = 'left') {
            const total = measureSpaced(text, spacing);
            let startX = x;
            if (align === 'center') startX = x - total / 2;
            else if (align === 'right') startX = x - total;
            const prevAlign = ctx.textAlign;
            ctx.textAlign = 'left';
            if (!spacing) {
                ctx.fillText(text, startX, y);
            } else if (SUPPORTS_LETTER_SPACING) {
                ctx.letterSpacing = `${spacing}px`;
                ctx.fillText(text, startX, y);
                ctx.letterSpacing = '0px';
            } else {
                let cx = startX;
                for (const ch of text) {
                    ctx.fillText(ch, cx, y);
                    cx += ctx.measureText(ch).width + spacing;
                }
            }
            ctx.textAlign = prevAlign;
        }

        function drawHotelTypography(width, height, colors, paletteObj) {
            ctx.save();

            // 上部コレクション表記
            ctx.fillStyle = colors[1];
            ctx.font = '500 11px "Montserrat", sans-serif';
            fillSpacedText(`COLLECTION NO. 0${state.paletteIndex + 1} — ARCHITECTURAL INTERIOR`, 72, 90, 5);

            // メインタイトル（洗練されたセリフ書体風）
            ctx.fillStyle = colors[0];
            ctx.font = '600 44px "Cinzel", "Shippori Mincho", serif';
            fillSpacedText(state.title, 72, height - 205, 2);

            // サブタイトル（パレット名はパレット本体から取る）
            ctx.fillStyle = colors[2];
            ctx.font = '400 13px "Montserrat", sans-serif';
            fillSpacedText(`TONE: ${state.mood.toUpperCase()} / PALETTE: ${getCurrentPalette().name}`, 72, height - 162, 1.5);

            // 下部カラーパレットスウォッチ
            const barY = height - 110;
            const barHeight = 24;
            const totalWidth = width - 144;
            const blockWidth = totalWidth / 5;

            colors.forEach((colorHex, idx) => {
                ctx.fillStyle = colorHex;
                ctx.fillRect(72 + idx * blockWidth, barY, blockWidth, barHeight);
                
                ctx.fillStyle = colors[1];
                ctx.font = '400 9px "Montserrat", monospace';
                fillSpacedText(paletteObj[idx].hex, 72 + (idx + 0.5) * blockWidth, barY + barHeight + 16, 1, 'center');
            });

            // フッタークレジット
            ctx.fillStyle = colors[2];
            ctx.font = '400 10px "Montserrat", monospace';
            fillSpacedText(`HOTEL GALLERY COLLECTION © 2026`, width - 72, height - 42, 0, 'right');
            
            ctx.restore();
        }

        function adjustBrightness(hex, percent) {
            let num = parseInt(hex.replace("#",""), 16),
                amt = Math.round(2.55 * percent),
                R = (num >> 16) + amt,
                G = (num >> 8 & 0x00FF) + amt,
                B = (num & 0x0000FF) + amt;
            return "#" + (0x1000000 + (R<255?R<1?0:R:255)*0x10000 + (G<255?G<1?0:G:255)*0x100 + (B<255?B<1?0:B:255)).toString(16).slice(1);
        }

        window.addEventListener('load', init);
    </script>
</body>
</html>
